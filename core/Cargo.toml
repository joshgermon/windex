[package]
name = "rexcore"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
publish = false
description = "Windex core: Rex protocol client, SSH forwarding and libghostty-vt terminals behind a C ABI"

[lib]
name = "rexcore"
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
base64 = "0.22"
flume = "0.11"
futures-util = { version = "0.3", features = ["sink"] }
ghostty-vt = { version = "=0.8.0", features = ["png"] }
log = "0.4"
parking_lot = "0.12"
percent-encoding = "2"
regex = "1"
regex-syntax = "0.8"
rexrs = { path = "vendor/rexrs", default-features = false, features = ["tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = { version = "0.6", features = ["all"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "sync", "fs", "io-util", "process"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
url = "2"
unicode-segmentation = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[[bin]]
name = "rexcore-probe"
path = "src/bin/probe.rs"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
debug = 1

[patch.crates-io]
ghostty-vt = { path = "vendor/ghostty-vt" }
